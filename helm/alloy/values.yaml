# Grafana Alloy Helm values
# Chart: grafana/alloy
# Docs: https://grafana.com/docs/alloy/latest/
#
# Tuned for a low-traffic node: small CPU/RAM, gentler scrape cadence,
# smaller trace batches, less log noise from Alloy itself.
#
alloy:
  # Fewer anonymous usage reports to Grafana Labs on a constrained node.
  enableReporting: false

  # Main Alloy container — use chart `alloy.resources` (not controller.resources).
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Alloy pipeline config lives in config/alloy/config.alloy (single source of truth).
  # deploy.sh injects it with: --set-file alloy.configMap.content=config/alloy/config.alloy
  # Do NOT run `helm upgrade` with this file alone: the config would be empty.
  configMap:
    create: true

  # OTLP gateway: user = Instance ID from Grafana → OpenTelemetry → Configure.
  extraEnv:
    - name: GRAFANA_CLOUD_OTLP_USER
      value: "1586681"
    - name: GRAFANA_OBSERVABILITY_USER_TOKEN
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: token
    - name: GRAFANA_OBSERVABILITY_OTLP_TOKEN
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: otlpToken

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  mounts:
    varlog: false

controller:
  type: deployment
  replicas: 1

serviceAccount:
  create: true
  name: grafana-alloy

rbac:
  create: true

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

service:
  enabled: true
  type: ClusterIP
